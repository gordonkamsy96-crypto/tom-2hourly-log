name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Unpack project from TomSupervisorLog.zip
        run: |
          if [ ! -f TomSupervisorLog.zip ]; then
            echo "::error title=Zip not found::TomSupervisorLog.zip is not in the repository root. Upload the zip file itself (do not unzip it) using Add file > Upload files."
            ls -la
            exit 1
          fi
          unzip -q -o TomSupervisorLog.zip
          echo "Project files:"
          ls -la TomSupervisorLog TomSupervisorLog/app TomSupervisorLog/app/src/main

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: TomSupervisorLog
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee ../build.log

      - name: Show the real error
        if: failure()
        run: |
          msg=$(grep -nE "^e: |error:|What went wrong|Execution failed|requires libraries|Could not |Unresolved reference|FAILURE" -A3 build.log | head -40 | cut -c1-260)
          msg="${msg//'%'/'%25'}"
          msg="${msg//$'\n'/'%0A'}"
          echo "::error title=Build error details::$msg"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v5
        with:
          name: TOM-2-Hourly-Log-APK
          path: TomSupervisorLog/app/build/outputs/apk/debug/app-debug.apk
